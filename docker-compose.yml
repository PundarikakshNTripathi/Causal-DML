version: '3.8'

services:
  fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  streamlit_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi_backend:8000/predict_cate
    depends_on:
      - fastapi_backend
    restart: unless-stopped
